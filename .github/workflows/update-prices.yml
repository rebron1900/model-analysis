name: Update model prices

on:
  schedule:
    # 00:00 UTC daily (shift to 0 16 * * * for 00:00 Beijing time)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-prices.mjs
      - name: Commit and push if changed
        run: |
          git diff --quiet -- data.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: refresh model prices from OpenRouter API"
          git push
